<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zindua Showdown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Open+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one studio stage in Zindua Hackathon colours (navy, magenta, blue). Scoreboard podiums on top, the set centre stage. */
:root {
  /* Zindua logo palette: black #070707, red #fb3c4e, white. Light theme first; dark below. */
  --stage: #ffffff;          /* page ground */
  --stage-2: #f5f5f5;        /* surfaces */
  --panel: #ffffff;
  --line: #e0e0e0;
  --ink: #070707;            /* logo black */
  --muted: #5c5c5c;
  --gold: #c8182c;           /* accent text: logo red, deepened for contrast on white */
  --accent-fill: #fb3c4e;
  --red: #fb3c4e;            /* logo red */
  --red-2: #ff5a69;
  --red-3: #d92a3c;
  --red-under: #8a1020;
  --p1: #d11f33;
  --p2: #070707;
  --good: #0d9b57;
  --bad: #d11f33;
  --code-bg: #f5f5f5; --tile: rgba(7,7,7,.04); --bulb: #fb3c4e;
  --halo-1: rgba(251,60,78,.14); --halo-2: rgba(7,7,7,.05); --halo-3: rgba(251,60,78,.08);
  --marq-a: #fff5f6; --marq-b: #ffffff; --marq-glow: rgba(251,60,78,.18); --marq-inset: rgba(7,7,7,.06);
  --logo-shadow: #ffc9cf; --red-glow: rgba(251,60,78,.4); --accent-glow: rgba(251,60,78,.3);
  --drop: rgba(7,7,7,.28); --ok-glow: rgba(13,155,87,.25); --bad-glow: rgba(209,31,51,.25);
  --ok-flash: rgba(13,155,87,.35); --bad-flash: rgba(209,31,51,.30);
  --display: 'Barlow Condensed', 'Oswald', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --body: 'Open Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --stage: #070707; --stage-2: #141414; --panel: #1c1c1c; --line: #343434;
    --ink: #ffffff; --muted: #b8b8b8;
    --gold: #fb3c4e; --accent-fill: #fb3c4e;
    --p1: #fb3c4e; --p2: #ffffff; --good: #3ee08f; --bad: #ff6b78;
    --code-bg: #000000; --tile: rgba(255,255,255,.04); --bulb: #ffffff;
    --halo-1: rgba(251,60,78,.24); --halo-2: rgba(255,255,255,.04); --halo-3: rgba(251,60,78,.12);
    --marq-a: #1d1d1d; --marq-b: #0c0c0c; --marq-glow: rgba(251,60,78,.30); --marq-inset: rgba(0,0,0,.5);
    --logo-shadow: #6e0f1a; --red-glow: rgba(251,60,78,.5); --accent-glow: rgba(251,60,78,.5);
    --drop: rgba(0,0,0,.6); --ok-glow: rgba(62,224,143,.5); --bad-glow: rgba(255,107,120,.5);
    --ok-flash: rgba(62,224,143,.6); --bad-flash: rgba(255,107,120,.55);
    color-scheme: dark;
} }
:root[data-theme="dark"] {
    --stage: #070707; --stage-2: #141414; --panel: #1c1c1c; --line: #343434;
    --ink: #ffffff; --muted: #b8b8b8;
    --gold: #fb3c4e; --accent-fill: #fb3c4e;
    --p1: #fb3c4e; --p2: #ffffff; --good: #3ee08f; --bad: #ff6b78;
    --code-bg: #000000; --tile: rgba(255,255,255,.04); --bulb: #ffffff;
    --halo-1: rgba(251,60,78,.24); --halo-2: rgba(255,255,255,.04); --halo-3: rgba(251,60,78,.12);
    --marq-a: #1d1d1d; --marq-b: #0c0c0c; --marq-glow: rgba(251,60,78,.30); --marq-inset: rgba(0,0,0,.5);
    --logo-shadow: #6e0f1a; --red-glow: rgba(251,60,78,.5); --accent-glow: rgba(251,60,78,.5);
    --drop: rgba(0,0,0,.6); --ok-glow: rgba(62,224,143,.5); --bad-glow: rgba(255,107,120,.5);
    --ok-flash: rgba(62,224,143,.6); --bad-flash: rgba(255,107,120,.55);
    color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--stage);
  color: var(--ink);
  font-family: var(--body);
  font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(ellipse 45% 60% at 18% -10%, var(--halo-1), transparent 70%),
    radial-gradient(ellipse 45% 60% at 82% -10%, var(--halo-2), transparent 70%),
    radial-gradient(ellipse 60% 40% at 50% 110%, var(--halo-3), transparent 70%),
    var(--stage);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

#app { max-width: 1180px; margin: 0 auto; min-height: 100%; display: grid; grid-template-rows: auto 1fr auto; gap: 18px; padding-block: 18px; }

/* ---------- Scoreboard ---------- */
.scorebar { display: grid; gap: 16px; }
.topbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.topbar .brand { justify-self: start; display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar .brand b { font-family: var(--display); font-weight: 800; font-size: 1.05rem; letter-spacing: .06em; text-transform: uppercase; line-height: 1; }
.topbar .brand b span { display: block; font-family: var(--body); font-weight: 600; font-size: .62rem; letter-spacing: .18em; color: var(--muted); margin-top: 4px; }
.topbar .roundinfo { text-align: center; display: grid; gap: 4px; justify-items: center; }
.topbar .tools { justify-self: end; }
.board { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 46px; align-items: stretch; }
.vs { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 2; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--stage); font: 800 .8rem/1 var(--display); letter-spacing: .06em; box-shadow: 0 0 0 4px var(--stage); }
.podium {
  position: relative; background: linear-gradient(180deg, var(--panel), var(--stage-2));
  border: 2px solid var(--line); border-radius: 14px; padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0;
  transition: border-color .3s, box-shadow .3s, transform .3s;
}
.podium .name { font-weight: 800; font-size: 1.15rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.podium .label { font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.podium .score { font-family: var(--display); font-weight: 800; font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.podium[data-p="0"] { --pc: var(--p1); } .podium[data-p="1"] { --pc: var(--p2); }
.podium .score { color: var(--pc); }
.podium.active { border-color: var(--pc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--pc) 25%, transparent), 0 0 40px color-mix(in srgb, var(--pc) 35%, transparent); transform: translateY(-2px); }
.podium.active::after { content: "ON AIR"; position: absolute; top: -10px; left: 14px; background: var(--pc); color: var(--stage); font: 700 .65rem/1 var(--body); letter-spacing: .14em; padding: 4px 7px; border-radius: 4px; }
.podium .score.pop { animation: pop .5s; }
@keyframes pop { 40% { transform: scale(1.35); } }
.roundinfo .round { font-family: var(--display); font-weight: 800; text-transform: uppercase; font-size: 1rem; color: var(--gold); white-space: nowrap; }
.roundinfo .sub { font-size: .7rem; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.iconbtn { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; font-size: .75rem; color: var(--muted); }
.iconbtn:hover { color: var(--ink); border-color: var(--muted); }

/* ---------- Stage ---------- */
#stage { display: grid; place-items: center; min-height: 0; }
.screen { width: 100%; display: grid; justify-items: center; gap: 22px; text-align: center; animation: enter .45s cubic-bezier(.2,.8,.2,1); }
@keyframes enter { from { opacity: .0; transform: translateY(14px) scale(.98); } }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.display { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; line-height: 1.02; }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.lede { color: var(--muted); max-width: 56ch; margin: 0; line-height: 1.5; }

/* Marquee logo */
.marquee { position: relative; padding: 24px 34px 22px; border-radius: 18px; border: 3px solid var(--red); background: linear-gradient(180deg, var(--marq-a), var(--marq-b)); box-shadow: 0 0 60px var(--marq-glow), inset 0 0 40px var(--marq-inset); max-width: 100%; }
.marquee::before, .marquee::after { content: ""; position: absolute; left: 14px; right: 14px; height: 8px; background: radial-gradient(circle, var(--bulb) 0 3px, transparent 3.5px) 0 0 / 18px 8px repeat-x; animation: bulbs 1s steps(2) infinite; }
.marquee::before { top: 6px; } .marquee::after { bottom: 6px; animation-delay: .5s; }
@keyframes bulbs { 50% { opacity: .35; } }
.logo { font-size: clamp(2.3rem, 10vw, 6.2rem); letter-spacing: .03em; color: var(--red); text-shadow: 0 4px 0 var(--logo-shadow), 0 0 40px var(--red-glow); }
.logo small { display: block; font-size: .36em; letter-spacing: .42em; color: var(--ink); text-shadow: none; margin-bottom: 6px; }

/* Setup */
.setup { display: grid; gap: 18px; width: min(720px, 100%); }
.players { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: grid; gap: 6px; text-align: left; }
.field label { font-size: .75rem; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
.field[data-p="0"] label { color: var(--p1); } .field[data-p="1"] label { color: var(--p2); }
.field input { background: var(--stage-2); border: 2px solid var(--line); border-radius: 12px; padding: 14px 16px; color: var(--ink); font: 700 1.15rem var(--body); width: 100%; box-sizing: border-box; }
.field[data-p="0"] input:focus { border-color: var(--p1); } .field[data-p="1"] input:focus { border-color: var(--p2); }
.seg { display: inline-flex; background: var(--stage-2); border: 2px solid var(--line); border-radius: 999px; padding: 4px; gap: 4px; }
.seg button { background: transparent; border: 0; border-radius: 999px; padding: 8px 16px; font-weight: 700; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--red); color: #fff; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }
.big-btn { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-size: 1.3rem; padding: 16px 34px; border-radius: 999px; border: 0; color: #fff; background: linear-gradient(180deg, var(--red-2), var(--red) 55%, var(--red-3)); box-shadow: 0 6px 0 var(--red-under), 0 0 40px var(--red-glow); transition: transform .1s, box-shadow .1s; }
.big-btn:hover { transform: translateY(-2px); }
.big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--red-under); }
.ghost-btn { background: transparent; border: 2px solid var(--line); border-radius: 999px; padding: 12px 22px; font-weight: 700; }
.ghost-btn:hover { border-color: var(--muted); }
.rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; text-align: left; }
.rule { background: var(--tile); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: .92rem; line-height: 1.4; color: var(--muted); }
.rule b { display: block; color: var(--ink); margin-bottom: 4px; }
.lineup { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { font-size: .78rem; font-weight: 700; padding: 6px 10px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); color: var(--c); background: color-mix(in srgb, var(--c) 10%, transparent); }

.logo-img { display: block; width: clamp(76px, 12vw, 100px); aspect-ratio: 1; border-radius: 16px; margin: 0 auto 8px; box-shadow: 0 0 0 1px var(--line), 0 8px 24px var(--drop); }
.mini-logo { display: block; width: 52px; height: 52px; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); }
.rule-bar { width: 150px; height: 5px; border-radius: 3px; background: var(--ink); margin: 12px auto 0; }
.illusion .ln { stroke: var(--gold); } .illusion .lb { fill: var(--muted); }
.hub { cursor: pointer; }
.big-btn.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { filter: brightness(1.14); box-shadow: 0 6px 0 var(--red-under), 0 0 74px var(--red-glow); } }
.theme-fab { position: fixed; z-index: 7; right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); width: 46px; height: 46px; padding: 0; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); color: var(--ink); display: grid; place-items: center; box-shadow: 0 4px 16px var(--drop); transition: border-color .2s, transform .15s; }
.theme-fab:hover { border-color: var(--red); transform: rotate(18deg); }
.theme-fab svg { width: 22px; height: 22px; display: block; }
footer { padding-bottom: 42px; }
/* Wheel */
.wheel-wrap { position: relative; width: min(440px, 82vw); aspect-ratio: 1; max-width: 100%; }
.wheel-wrap canvas { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 40px var(--drop)); }
.pointer { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 34px solid var(--ink); filter: drop-shadow(0 3px 0 var(--red-under)); z-index: 2; }
.hub { position: absolute; inset: 41%; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8d98, var(--red) 55%, #a8132a); box-shadow: 0 0 0 5px var(--stage), 0 0 22px var(--red-glow); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 1rem; color: #fff; }

/* Announcements */
.huge { font-size: clamp(2.4rem, 11vw, 7.4rem); }
.marquee { min-width: 0; } .marquee h1 { overflow-wrap: anywhere; }
.whose { font-size: clamp(2.1rem, 6.4vw, 3.8rem); }
.pc0 { color: var(--p1); } .pc1 { color: var(--p2); }
.count { font-family: var(--display); font-weight: 800; font-size: clamp(5rem, 22vw, 12rem); line-height: 1; color: var(--gold); text-shadow: 0 0 60px var(--accent-glow); animation: thump .9s ease-out; }
@keyframes thump { from { transform: scale(1.8); opacity: 0; } 30% { opacity: 1; } }
.game-card { border: 3px solid var(--c); border-radius: 20px; padding: 26px 34px; background: radial-gradient(circle at 50% 0, color-mix(in srgb, var(--c) 25%, transparent), transparent 70%), var(--stage-2); box-shadow: 0 0 60px color-mix(in srgb, var(--c) 30%, transparent); max-width: 640px; }
.game-card h2 { color: var(--c); font-size: clamp(2rem, 7vw, 3.8rem); }
.game-card p { margin: 10px 0 0; font-size: 1.15rem; line-height: 1.45; }

/* Game area */
.game { width: min(900px, 100%); display: grid; gap: 16px; }
.game-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.tag { font-family: var(--display); font-weight: 800; text-transform: uppercase; color: var(--c); font-size: 1.1rem; }
.who { font-weight: 800; }
.timer { height: 10px; border-radius: 999px; background: var(--stage-2); border: 1px solid var(--line); overflow: hidden; }
.timer i { display: block; height: 100%; background: linear-gradient(90deg, var(--red-3), var(--red) 55%, var(--red-2)); transform-origin: left; }
.area { min-height: 340px; display: grid; place-items: center; gap: 20px; align-content: center; text-align: center; }
.flash { font-family: var(--display); font-weight: 800; font-size: clamp(3rem, 12vw, 7rem); letter-spacing: .02em; }
.mask { font-family: var(--mono); font-size: clamp(3rem, 12vw, 7rem); color: var(--line); }
.ask { font-size: clamp(1.25rem, 3.4vw, 1.8rem); font-weight: 700; margin: 0; max-width: 40ch; line-height: 1.3; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; font-size: clamp(1rem, 2.6vw, 1.35rem); font-weight: 700; min-width: 0; transition: transform .1s, border-color .2s, background .2s; }
.opt span { min-width: 0; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-2px); }
.opt kbd { font-family: var(--display); font-weight: 800; font-size: .9rem; background: var(--stage); border: 1px solid var(--line); border-radius: 8px; padding: 4px 9px; color: var(--gold); flex: none; }
.opt.right { background: color-mix(in srgb, var(--good) 25%, var(--panel)); border-color: var(--good); }
.opt.wrong { background: color-mix(in srgb, var(--bad) 25%, var(--panel)); border-color: var(--bad); }
.opt:disabled { cursor: default; }
.code { text-align: left; font-family: var(--mono); font-size: clamp(1.1rem, 3.4vw, 1.8rem); background: var(--code-bg); border: 1px solid var(--line); border-radius: 14px; padding: 40px 26px 18px; margin: 0; max-width: 100%; overflow-x: auto; position: relative; }
.code .lang { position: absolute; top: 9px; left: 14px; background: var(--red); color: #fff; font: 700 .7rem/1 var(--body); letter-spacing: .14em; text-transform: uppercase; padding: 5px 8px; border-radius: 5px; }
.emoji-big { font-size: clamp(4rem, 14vw, 7.5rem); letter-spacing: .1em; line-height: 1.1; }
.emoji-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; font-size: clamp(2.6rem, 9vw, 4.4rem); }
.emoji-grid span { background: var(--stage-2); border: 1px solid var(--line); border-radius: 16px; padding: 8px 18px; }
.dots { position: relative; width: min(520px, 100%); aspect-ratio: 16 / 10; background: var(--stage-2); border: 1px solid var(--line); border-radius: 16px; }
.dots i { position: absolute; width: 6%; aspect-ratio: 1; border-radius: 50%; background: var(--accent-fill); box-shadow: 0 0 12px var(--accent-glow); transform: translate(-50%, -50%); }
.digits { font-family: var(--mono); font-weight: 700; font-size: clamp(2.6rem, 11vw, 6rem); letter-spacing: .12em; color: var(--gold); }
.vault { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.vault input { font: 700 clamp(1.6rem, 6vw, 2.6rem) var(--mono); letter-spacing: .15em; text-align: center; width: min(380px, 100%); box-sizing: border-box; background: var(--stage-2); border: 2px solid var(--line); border-radius: 14px; padding: 12px; color: var(--ink); }
.vault input:focus { border-color: var(--gold); }
.clash-word { font-family: var(--display); font-weight: 800; font-size: clamp(3.4rem, 13vw, 7rem); }
.clash-progress { color: var(--muted); font-weight: 700; letter-spacing: .14em; }
.swatches { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; width: 100%; }
.swatch { border: 0; border-radius: 14px; padding: 18px 8px; font-weight: 800; font-size: 1.05rem; color: #140d2c; display: grid; gap: 4px; justify-items: center; }
.swatch kbd { font-family: var(--display); font-weight: 800; font-size: .8rem; opacity: .7; }
.oddgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; width: min(480px, 100%); }
.oddgrid button { aspect-ratio: 1; background: var(--stage-2); border: 1px solid var(--line); border-radius: 10px; font-size: clamp(1.3rem, 5vw, 2.1rem); font-weight: 800; padding: 0; display: grid; place-items: center; }
.oddgrid button:hover { border-color: var(--gold); }
.oddgrid button.right { background: color-mix(in srgb, var(--good) 35%, var(--stage-2)); border-color: var(--good); }
.oddgrid button.wrong { background: color-mix(in srgb, var(--bad) 35%, var(--stage-2)); border-color: var(--bad); }
.trick-text { font-family: var(--display); font-weight: 800; font-size: clamp(1.2rem, 3.6vw, 2rem); line-height: 1.5; max-width: 32ch; }
.triangle { width: min(360px, 90%); aspect-ratio: 1.15; clip-path: polygon(50% 0, 100% 100%, 0 100%); background: var(--gold); color: var(--stage); display: grid; place-items: end center; padding-bottom: 12%; box-sizing: border-box; font-family: var(--display); font-weight: 800; font-size: clamp(1.1rem, 4.4vw, 1.7rem); line-height: 1.2; }
.illusion { width: min(460px, 100%); }
.plain-q { font-size: clamp(1.25rem, 3.4vw, 1.8rem); font-weight: 700; max-width: 38ch; line-height: 1.35; margin: 0; }
.seq { font-family: var(--display); font-weight: 800; font-size: clamp(4rem, 16vw, 9rem); color: var(--gold); min-height: 1.2em; }

/* Result */
.verdict { font-size: clamp(3rem, 11vw, 7rem); }
.verdict.ok { color: var(--good); text-shadow: 0 0 50px var(--ok-glow); }
.verdict.no { color: var(--bad); text-shadow: 0 0 50px var(--bad-glow); }
.reveal { font-size: 1.2rem; color: var(--muted); }
.reveal b { color: var(--ink); }
.points { font-family: var(--display); font-weight: 800; font-size: 2.2rem; color: var(--gold); }
.flash-bg { position: fixed; inset: 0; pointer-events: none; z-index: 5; animation: flashbg .7s ease-out forwards; }
@keyframes flashbg { from { opacity: .45; } to { opacity: 0; } }

/* Chooser */
.picks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; width: 100%; }
.pick { background: var(--stage-2); border: 2px solid color-mix(in srgb, var(--c) 55%, transparent); border-radius: 14px; padding: 14px 10px; display: grid; gap: 6px; justify-items: center; text-align: center; transition: transform .12s, background .2s; min-width: 0; }
.pick:hover { transform: translateY(-3px); background: color-mix(in srgb, var(--c) 18%, var(--stage-2)); }
.pick .mono { font-family: var(--display); font-weight: 800; font-size: 1.6rem; color: var(--c); }
.pick .nm { font-weight: 800; font-size: .95rem; }
.pick .ds { font-size: .78rem; color: var(--muted); line-height: 1.3; }
.pick.chosen { background: color-mix(in srgb, var(--c) 35%, var(--stage-2)); border-color: var(--c); transform: scale(1.06); }

/* Finale */
.final-scores { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.final-scores div { background: var(--stage-2); border: 2px solid var(--line); border-radius: 14px; padding: 14px 22px; min-width: 160px; }
.final-scores b { display: block; font-family: var(--display); font-weight: 800; font-size: 2.6rem; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 6; width: 100%; height: 100%; }

footer { text-align: center; font-size: .78rem; color: var(--muted); letter-spacing: .06em; }

@media (max-width: 720px) {
  .marquee { padding: 20px 18px 18px; }
  .board { gap: 38px; }
  .topbar { grid-template-columns: auto 1fr auto; gap: 8px; }
  .topbar .brand b { display: none; }
  .mini-logo { width: 40px; height: 40px; }
  .vs { width: 32px; height: 32px; font-size: .7rem; }
  .podium { padding: 10px 12px; }
  .podium .score { font-size: 1.7rem; }
  .players, .rules { grid-template-columns: 1fr; }
  .picks { grid-template-columns: repeat(2, 1fr); }
  .swatches { grid-template-columns: repeat(2, 1fr); }
  .area { min-height: 280px; }
}
@media (max-width: 460px) { .opts { grid-template-columns: 1fr; } .oddgrid { grid-template-columns: repeat(5, 1fr); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; } }
</style>

  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();

}

/* ---------- reusable game pieces ---------- */
function startTimer(ctx, sec, onEnd) {
  const bar = ctx.bar, t0 = performance.now(), g = gen; let raf, lastSec = Math.ceil(sec), off = false;
  const f = now => {
    if (off || g !== gen) return;
    const frac = 1 - (now - t0) / (sec * 1000);
    bar.style.transform = `scaleX(${Math.max(0, frac)})`;
    const left = Math.ceil(frac * sec);
    if (left < lastSec) { lastSec = left; if (left <= 3 && left > 0) sfx.tick(); }
    if (frac <= 0) { off = true; onEnd(); return; }
    raf = requestAnimationFrame(f);
  };
  raf = requestAnimationFrame(f);
  return () => { off = true; cancelAnimationFrame(raf); return Math.max(0, 1 - (performance.now() - t0) / (sec * 1000)); };
}
function mcq(ctx, { html, options, answer, seconds, keepOrder }) {
  const opts = keepOrder ? options : shuffle(options);
  ctx.area.innerHTML = `${html}<div class="opts">${opts.map((o, i) => `<button class="opt" type="button" data-i="${i}"><kbd>${i + 1}</kbd><span>${esc(o)}</span></button>`).join('')}</div>`;
  const btns = [...ctx.area.querySelectorAll('.opt')];
  const stop = startTimer(ctx, seconds, () => { btns.forEach((b, i) => { b.disabled = true; if (opts[i] === answer) b.classList.add('right'); }); ctx.done(false, 0, answer, true); });
  const choose = i => {
    const frac = stop(); S.keys = null;
    btns.forEach((b, j) => { b.disabled = true; if (opts[j] === answer) b.classList.add('right'); });
    const ok = opts[i] === answer; if (!ok) btns[i].classList.add('wrong');
    ctx.done(ok, frac, answer);
  };
  btns.forEach((b, i) => b.addEventListener('click', () => choose(i)));
  S.keys = e => { const n = parseInt(e.key, 10); if (n >= 1 && n <= opts.length) choose(n - 1); };
}
function nearby(n, step, count = 3) { const s = new Set([n]); let tries = 0; while (s.size < count + 1 && tries++ < 50) { const d = rint(1, 3) * step * (Math.random() < .5 ? -1 : 1); if (n + d > 0) s.add(n + d); } return [...s].filter(x => x !== n).map(String); }

async function coinToss() {
  S.turn = Math.random() < .5 ? 0 : 1; board();
  document.querySelectorAll('.podium').forEach(el => el.classList.remove('active'));
  screen(`<p class="eyebrow">Coin toss</p><h2 class="display whose" id="toss">…</h2>`);
  for (let k = 0; k < 12; k++) { const i = k % 2; const t = $('#toss'); t.textContent = S.players[i].name; t.className = `display whose pc${i}`; sfx.click(); await wait(90 + k * 18); }
  screen(`<p class="eyebrow">Coin toss</p><h2 class="display huge pc${S.turn}">${esc(S.players[S.turn].name)}</h2><p class="lede">goes first.</p>`);
  sfx.reveal(); board(); await wait(1800);
  await turnIntro();
}

  if (S.nextGame) {
    const g = G(S.nextGame), by = S.players[S.chosenBy];
    screen(`<p class="eyebrow">${esc(by.name)} chose your challenge</p><h2 class="display whose pc${S.turn}">${esc(p.name)}, you’re playing</h2>
      <div class="game-card" style="--c:${gcol(g)}"><h2 class="display">${g.name}</h2></div>`);
    sfx.reveal(); await wait(2600);
    return playGame(g);
  }
  screen(`<p class="eyebrow" id="spinHint">Press spin to pick a game</p><h2 class="display whose pc${S.turn}">${esc(p.name)}’s turn</h2>
    <div class="wheel-wrap"><div class="pointer"></div><canvas id="wheel" width="880" height="880"></canvas><div class="hub" id="hub">GO</div></div>
    <button class="big-btn pulse" id="spinBtn" type="button">Spin the wheel</button>`);
  drawWheel($('#wheel'), wheelRot);
  $('#spinBtn').focus();
  await new Promise(res => {
    let done = false;
    const go = () => { if (done) return; done = true; S.keys = null; $('#spinBtn').hidden = true; $('#spinHint').textContent = 'Spinning…'; res(); };
    $('#spinBtn').addEventListener('click', go);
    $('#hub').addEventListener('click', go);
    S.keys = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
  });
  const g = await spinWheel($('#wheel'));
  await wait(900);
  return playGame(g);
}

/* Wheel */
let wheelRot = 0;
function drawWheel(cv, rot) {
  const c = cv.getContext('2d'), R = cv.width / 2, seg = Math.PI * 2 / GAMES.length;
  c.clearRect(0, 0, cv.width, cv.height); c.save(); c.translate(R, R); c.rotate(rot);
  GAMES.forEach((g, i) => {
    c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, R - 8, i * seg, (i + 1) * seg); c.closePath();
    const col = gcol(g); c.fillStyle = col; c.fill(); c.lineWidth = 6; c.strokeStyle = tok('--stage'); c.stroke();
    c.save(); c.rotate(i * seg + seg / 2); c.textAlign = 'right'; c.textBaseline = 'middle'; c.fillStyle = onColor(col);
    c.font = '800 40px "Barlow Condensed", "Arial Narrow", sans-serif'; c.fillText(g.name.length > 11 ? g.name.split(' ').pop() : g.name, R - 34, 0); c.restore();
  });
  c.restore();
  c.beginPath(); c.arc(R, R, R - 6, 0, Math.PI * 2); c.lineWidth = 12; c.strokeStyle = '#fb3c4e'; c.stroke();
  for (let k = 0; k < 30; k++) { const a = k / 30 * Math.PI * 2; c.beginPath(); c.arc(R + Math.cos(a) * (R - 6), R + Math.sin(a) * (R - 6), 5, 0, Math.PI * 2); c.fillStyle = k % 2 ? '#ffffff' : '#ffc2c8'; c.fill(); }
}
function spinWheel(cv) {
  return new Promise((res, rej) => {
    const g0 = gen, seg = Math.PI * 2 / GAMES.length;
    let t; do { t = rint(0, GAMES.length - 1); } while (GAMES[t].id === S.last && GAMES.length > 1);
    let target = -Math.PI / 2 - (t + .5) * seg + (Math.random() - .5) * seg * .6;
    const two = Math.PI * 2; target = ((target % two) + two) % two;
    const start = wheelRot, base = start - (start % two) + two * 5, end = base + target + (base + target < start + two * 4 ? two : 0);
    const dur = 4200, t0 = performance.now(); let lastIdx = -1;
    drawWheel(cv, start);
    const f = now => {
      if (g0 !== gen) return rej('stale');
      const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 4), rot = start + (end - start) * e;
      drawWheel(cv, rot);
      const idx = Math.floor((((-Math.PI / 2 - rot) % two) + two) % two / seg);
      if (idx !== lastIdx) { lastIdx = idx; sfx.click(); }
      if (k < 1) requestAnimationFrame(f); else { wheelRot = end % two; sfx.reveal(); res(GAMES[t]); }
    };
    setTimeout(() => requestAnimationFrame(f), 500);
  });
}

async function playGame(g) {
  S.last = g.id; S.nextGame = null;
  const p = S.players[S.turn];
  screen(`<p class="eyebrow">${esc(p.name)} · next game</p><div class="game-card" style="--c:${gcol(g)}"><h2 class="display">${g.name}</h2><p>${g.rule}</p></div><div class="count" id="cd">3</div>`);
  await wait(1600);
  for (const n of [3, 2, 1]) { const cd = $('#cd'); cd.textContent = n; cd.style.animation = 'none'; void cd.offsetWidth; cd.style.animation = ''; sfx.tick(); await wait(750); }
  sfx.go();
  const el = screen(`<div class="game"><div class="game-head"><span class="tag" style="--c:${gcol(g)}">${g.name}</span><span class="who pc${S.turn}">${esc(p.name)}</span></div><div class="timer"><i></i></div><div class="area"></div></div>`);
  el.style.animation = 'none';
  return new Promise(resolve => {
    let finished = false;
    const ctx = {
      area: el.querySelector('.area'), bar: el.querySelector('.timer i'),
      done: (ok, frac, answer, timeout) => {
        if (finished) return; finished = true; S.keys = null;
        flow(async () => { await wait(1100); await result(ok, frac, answer, timeout); resolve(); });
      },
    };
    g.play(ctx).catch(e => { if (e !== 'stale') console.error(e); });
  });
}

async function result(ok, frac, answer, timeout) {
  const p = S.players[S.turn], opp = S.players[1 - S.turn];
  let pts = 0;
  if (ok) { pts = 100 + Math.round(50 * frac); p.score += pts; p.hits++; sfx.good(); flashBg('radial-gradient(circle, ' + tok('--ok-flash') + ', transparent 70%)'); }
  else { sfx.bad(); flashBg('radial-gradient(circle, ' + tok('--bad-flash') + ', transparent 70%)'); }
  board(); if (ok) bump(S.turn);
  screen(ok
    ? `<h2 class="display verdict ok">Correct!</h2><div class="points">+${pts}</div><p class="reveal">Answer: <b>${esc(answer)}</b></p><p class="lede">${esc(p.name)} now picks ${esc(opp.name)}’s next challenge.</p>`
    : `<h2 class="display verdict no">${timeout ? 'Time’s up!' : 'Missed it!'}</h2><p class="reveal">The answer was <b>${esc(answer)}</b></p><p class="lede">The wheel will choose ${esc(opp.name)}’s next game.</p>`);
  await wait(2600);
  const lastTurn = S.turnNo + 1 >= S.rounds * 2;
  if (ok && !lastTurn) await chooser();
  S.turnNo++; S.turn = 1 - S.turn;
  if (S.turnNo >= S.rounds * 2) return finale();
  return turnIntro();
}

function chooser() {
  const me = S.turn, opp = S.players[1 - me];
  screen(`<p class="eyebrow">Your reward</p><h2 class="display whose pc${me}">${esc(S.players[me].name)}, pick ${esc(opp.name)}’s next game</h2>
    <div class="game" style="width:100%"><div class="timer"><i></i></div></div>
    <div class="picks">${GAMES.map(g => `<button class="pick" type="button" data-id="${g.id}" style="--c:${gcol(g)}"><span class="mono">${g.mono}</span><span class="nm">${g.name}</span><span class="ds">${g.rule}</span></button>`).join('')}</div>
    <p class="lede">No choice in 12 seconds and the wheel picks a random one.</p>`);
  const g0 = gen;
  return new Promise((res, rej) => {
    let done = false;
    const choose = id => {
      if (done) return; done = true; stop();
      S.nextGame = id; S.chosenBy = me; sfx.reveal();
      stage.querySelectorAll('.pick').forEach(b => b.classList.toggle('chosen', b.dataset.id === id));
      setTimeout(() => (g0 === gen ? res() : rej('stale')), 1100);
    };
    const stop = startTimer({ bar: stage.querySelector('.timer i') }, 12, () => choose(pick(GAMES).id));
    stage.querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => choose(b.dataset.id)));
  });
}

async function finale() {
  board(); document.querySelectorAll('.podium').forEach(el => el.classList.remove('active'));
  const [a, b] = S.players, tie = a.score === b.score, w = a.score > b.score ? 0 : 1;
  screen(`<p class="eyebrow">And the winner is…</p><div class="count" id="drum">?</div>`);
  for (let k = 0; k < 8; k++) { sfx.click(); await wait(160); }
  sfx.fanfare();
  screen(`<p class="eyebrow">${tie ? 'It’s a draw' : 'Champion of the brain break'}</p>
    <div class="marquee"><img class="logo-img" src="${LOGO_SRC}" alt="Zindua School"><h1 class="display huge ${tie ? '' : 'pc' + w}" style="${tie ? 'color:var(--gold)' : ''}">${tie ? 'Tie game!' : esc(S.players[w].name)}</h1></div>
    <div class="final-scores">${S.players.map((p, i) => `<div><span class="pc${i}" style="font-weight:800">${esc(p.name)}</span><b class="pc${i}">${p.score}</b><span class="lede">${p.hits} of ${S.rounds} won</span></div>`).join('')}</div>
    <div class="row"><button class="big-btn" type="button" id="again">Rematch</button><button class="ghost-btn" type="button" id="newp">New players</button></div>`);
  confetti();
  $('#again').addEventListener('click', () => { S.players.forEach(p => { p.score = 0; p.hits = 0; }); S.turnNo = 0; S.nextGame = null; S.last = null; run(coinToss); });
  $('#newp').addEventListener('click', () => { S.players.forEach((p, i) => { p.name = `Player ${i + 1}`; p.score = 0; p.hits = 0; }); showSetup(); });
}

function confetti() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = $('#confetti'); cv.hidden = false; const c = cv.getContext('2d');
  cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; c.scale(devicePixelRatio, devicePixelRatio);
  const cols = ['#fb3c4e', '#ff5a69', '#c4182a', '#ff8a96', tok('--ink'), '#ffffff'];
  const ps = Array.from({ length: 180 }, () => ({ x: Math.random() * innerWidth, y: -20 - Math.random() * innerHeight * .6, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 3.5, r: Math.random() * 6, s: 5 + Math.random() * 7, c: pick(cols), w: Math.random() * .2 }));
  const t0 = performance.now();
  const f = now => {
    c.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += p.w; c.save(); c.translate(p.x, p.y); c.rotate(p.r); c.fillStyle = p.c; c.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); c.restore(); });
    if (now - t0 < 5000) requestAnimationFrame(f); else { c.clearRect(0, 0, innerWidth, innerHeight); cv.hidden = true; }
  };
  requestAnimationFrame(f);
}

/* ---------- boot (keeps player names across live page updates) ---------- */
try { window.claude?.hot?.snapshot?.(() => ({ names: S.players.map(p => p.name), rounds: S.rounds })); } catch (e) {}
const start = (data = {}) => {
  if (data && Array.isArray(data.names)) data.names.forEach((n, i) => { if (S.players[i] && n) S.players[i].name = n; });
  if (data && data.rounds) S.rounds = data.rounds;
  showSetup();
};
try { window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {}); } catch (e) { start({}); }
})();
</script>
